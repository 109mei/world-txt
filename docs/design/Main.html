<style>
body{margin:0;background:#050506;font-family:'Shippori Mincho',serif;color:#eceae4}
a{color:#eceae4;text-decoration:none}a:hover{color:#ffffff}
/* 動くのは何か起きたときだけ。この画面では、今年はじめて出た兆しのカードが1回だけ現れて止まる（約2.6秒） */
@keyframes arrive{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(242,163,147,0.55)}100%{box-shadow:0 0 0 6px rgba(242,163,147,0)}}
.arrive{animation:arrive .6s ease-out both, ring 1s ease-out .6s 2}
.sw{width:24px;height:14px;box-sizing:border-box;border-radius:7px;border:1px solid #8b8f97;position:relative;display:inline-block}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:4px;background:#8b8f97;transition:left .15s}
#names:checked ~ label .sw{border-color:#d8dbe2;background:rgba(216,219,226,.15)}
#names:checked ~ label .sw::after{left:12px;background:#eceae4}
#names:not(:checked) ~ svg .lbl{display:none}
#names:focus-visible ~ label{outline:2px solid #a6cdff;outline-offset:-2px}
@media (prefers-reduced-motion: reduce){.arrive{animation:none}}
</style>
</helmet>
