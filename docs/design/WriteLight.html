<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>書く（世界の読み）・明るい画面</title>

</head>
<body>
<div>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Shippori+Mincho:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f6f4ef;font-family:'Shippori Mincho',serif;color:#1c1d21}
a{color:#1c1d21;text-decoration:none}a:hover{color:#000000}
textarea:focus{outline:2px solid #1b5aa6;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f6f4ef; position: relative; overflow: hidden; font-family: 'Shippori Mincho', serif; color: #1c1d21;">

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: #f6f4ef; opacity: 0.5;">
<div style="height: 64px; background: #eeebe4; border-bottom: 1px solid rgba(40,42,48,0.14);"></div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 18px;">
<div style="height: 14px; width: 220px; background: #dedad2;"></div>
<div style="height: 14px; width: 180px; background: #dedad2;"></div>
<div style="height: 14px; width: 250px; background: #dedad2;"></div>
</div>
</div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(255,255,255,0.55);"></div>

<section aria-label="行を書き換える" style="position: absolute; left: 0; top: 56px; width: 390px; height: 788px; box-sizing: border-box; background: #ffffff; border-top: 1px solid rgba(40,42,48,0.32); border-radius: 16px 16px 0 0; display: flex; flex-direction: column;">

<div style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(40,42,48,0.12);">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#30333a" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="6" r="2.5"></circle><path d="M12 9v7M8 12h8M12 16l-3 5M12 16l3 5"></path></svg>
<span style="font-size: 17px;">人間</span>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 14px; color: #50555e;">01行目</span>
<span style="flex-grow: 1;"></span>
<a href="TextLight.html" aria-label="閉じる" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #30333a;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div style="flex-grow: 1; overflow: hidden; box-sizing: border-box; padding: 12px 18px 0; display: flex; flex-direction: column; gap: 10px;">

<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 11px; letter-spacing: 0.3em; color: #5c616a;">いまの文章</span>
<span style="font-size: 17px; color: #1b5aa6;">人間は二日に一度食べる。</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="editor" style="font-size: 11px; letter-spacing: 0.3em; color: #5c616a;">書き換える</label>
<textarea id="editor" rows="2" style="box-sizing: border-box; width: 100%; height: 58px; resize: none; padding: 12px 14px; background: #fbfaf7; border: 1px solid #1b5aa6; border-radius: 6px; color: #1b5aa6; font-family: 'Shippori Mincho', serif; font-size: 18px; line-height: 1.5;">人間は二日に一度だけ食べ、魚を獲る</textarea>
</div>

<div style="box-sizing: border-box; padding: 10px 12px; background: #ebe8e0; border: 1px solid rgba(40,42,48,0.14); border-radius: 6px; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;">
<span style="font-size: 11px; letter-spacing: 0.3em; color: #50555e;">世界の読み</span>
<span style="font-size: 10px; color: #5c616a;"><span style="border-bottom: 2px solid #30333a;">読める</span>　<span style="border-bottom: 2px dotted #6443be;">知らない</span></span>
</div>
<div style="font-size: 17px; line-height: 1.8; letter-spacing: 0.02em;">
<span style="border-bottom: 2px solid #30333a; margin: 0 2px;">人間</span>は<span style="border-bottom: 2px solid #30333a; margin: 0 2px;">二日に一度</span><span style="border-bottom: 2px solid #30333a; margin: 0 2px;">だけ</span><span style="border-bottom: 2px solid #30333a; margin: 0 2px;">食べ</span>、<span style="border-bottom: 2px solid #30333a; margin: 0 2px;">魚</span>を<span style="border-bottom: 2px dotted #6443be; color: #6443be; margin: 0 2px;">獲る</span>
</div>
<div style="font-size: 12px; line-height: 1.6; color: #6443be;">「獲る」は、世界がまだ知らない言葉。この言葉のぶんは世界に届かない。</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #50555e;">読まれ方<span style="padding: 1px 7px; border: 1px solid #30333a; border-radius: 10px; color: #1c1d21; background: rgba(40,42,48,0.12);">性質</span><span style="padding: 1px 7px; border: 1px solid rgba(40,42,48,0.2); border-radius: 10px; color: #61666e;">制度</span><span style="padding: 1px 7px; border: 1px solid rgba(40,42,48,0.2); border-radius: 10px; color: #61666e;">条件つき</span></div>
<div style="font-size: 12px; line-height: 1.6; color: #30333a;">人の体と習慣が変わる。国がなくても効く。</div>
<a href="NotebookLight.html" style="align-self: flex-start; min-height: 32px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #30333a; border-bottom: 1px solid rgba(40,42,48,0.4);">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>
世界の辞書で、知っている言葉を探す</a>
</div>

<div style="display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0;">
<button style="height: 40px; padding: 0 14px; background: transparent; border: 1px solid rgba(40,42,48,0.32); border-radius: 20px; color: #30333a; font-family: inherit; font-size: 14px; flex-shrink: 0;">〜ない</button>
<button style="height: 40px; padding: 0 14px; background: transparent; border: 1px solid rgba(40,42,48,0.32); border-radius: 20px; color: #30333a; font-family: inherit; font-size: 14px; flex-shrink: 0;">少し</button>
<button style="height: 40px; padding: 0 14px; background: transparent; border: 1px solid rgba(40,42,48,0.32); border-radius: 20px; color: #30333a; font-family: inherit; font-size: 14px; flex-shrink: 0;">とても</button>
<button style="height: 40px; padding: 0 14px; background: transparent; border: 1px solid rgba(40,42,48,0.32); border-radius: 20px; color: #30333a; font-family: inherit; font-size: 14px; flex-shrink: 0;">ただし</button>
<button style="height: 40px; padding: 0 14px; background: transparent; border: 1px solid rgba(40,42,48,0.32); border-radius: 20px; color: #30333a; font-family: inherit; font-size: 14px; flex-shrink: 0;">〜のとき</button>
<button style="height: 40px; padding: 0 14px; background: transparent; border: 1px solid rgba(40,42,48,0.32); border-radius: 20px; color: #30333a; font-family: inherit; font-size: 14px; flex-shrink: 0;">なしで</button>
</div>

<div style="display: flex; justify-content: space-between; align-items: baseline;">
<span style="font-size: 13px; color: #30333a;"><span style="font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600;">16</span>字<span style="color: #5c616a;">　＋効き目 0</span></span>
<span style="font-size: 12px; color: #50555e;">使える文字数 <span style="font-family: 'Cormorant Garamond', serif; font-size: 15px;">552 → </span><span style="font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 600; color: #1c1d21;">557</span><span style="font-family: 'Cormorant Garamond', serif; font-size: 15px;"> / 590字</span></span>
</div>

<div style="font-size: 12px; line-height: 1.6; color: #835f0c;">この行を書き直すのは2回目。上書きの傷で、世界の整合性が少し下がる。</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<a href="TextLight.html" style="height: 54px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; background: #ffffff; border: 1px solid #30333a; border-radius: 6px; font-size: 16px; letter-spacing: 0.1em;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 20l4-1L19 8l-3-3L5 16l-1 4z"></path><path d="M14 7l3 3"></path></svg>
書き換える<span style="font-size: 12px; color: #1b5aa6;">のこり3</span></a>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<a href="TextLight.html" style="height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid rgba(40,42,48,0.32); border-radius: 6px; font-size: 14px; color: #30333a;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 12h16"></path><path d="M6 7h9M6 17h7"></path></svg>
この行を消す</a>
<a href="TextLight.html" style="height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(40,42,48,0.32); border-radius: 6px; font-size: 14px; color: #30333a;">元の文に戻す</a>
</div>
</div>

<div style="box-sizing: border-box; padding: 10px 12px; background: #ebe8e0; border-radius: 6px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 11px; letter-spacing: 0.3em; color: #5c616a;">現実では</span>
<span style="font-size: 12px; line-height: 1.7; color: #30333a;">人は1日に約2000〜2500kcalを食べ物からとる。世界の働き手の約4分の1は農業で働いている。</span>
</div>
</div>
</section>
</div>
</div>

</body>
</html>
