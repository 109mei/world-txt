<!doctype html>

<body>
<div>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=Shippori+Mincho:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f3f1ec;font-family:'Shippori Mincho',serif;color:#1c1d21}
a{color:#1c1d21;text-decoration:none}a:hover{color:#000000}
/* 1年進めたときに1回だけ（約1.2秒）。動くのは「回る年」と「流れる世界」の2つだけ */
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(-96px)}}
@keyframes rush{from{transform:translateX(0)}to{transform:translateX(-160px)}}
.roll{animation:roll 1.2s cubic-bezier(.7,0,.2,1) 1 both}
.rush{animation:rush 1.2s linear 1 both}
@media (prefers-reduced-motion: reduce){.roll,.rush{animation:none}}
</style>
</helmet>
<a href="ChainLight.html" aria-label="計算の演出。タップで飛ばして結果へ" style="width: 390px; height: 844px; box-sizing: border-box; background: #f3f1ec; position: relative; overflow: hidden; display: block; font-family: 'Shippori Mincho', serif; color: #1c1d21;">

<filter id="hblur" x="-40%" y="-20%" width="180%" height="140%"><feGaussianBlur stdDeviation="7 0"></feGaussianBlur></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>

<text x="214" y="200">L = WORLD.txt</text>
<text x="170" y="96">P(t+1) = P(t)(1 + b − d)</text>
<text x="22" y="236">dT/dt ∝ ln(CO₂/C₀)</text>

<div style="font-size: 13px; color: #50555e; letter-spacing: 0.2em;">12 → 13</div>
