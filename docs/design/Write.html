<!doctype html>

<title>書く（世界の読み）</title>

</head>
<body>
<div>
<helmet>

<style>
body{margin:0;background:#050506;font-family:'Shippori Mincho',serif;color:#eceae4}
a{color:#eceae4;text-decoration:none}a:hover{color:#ffffff}
textarea:focus{outline:2px solid #a6cdff;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #050506; position: relative; overflow: hidden; font-family: 'Shippori Mincho', serif; color: #eceae4;">

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: #050506; opacity: 0.5;">
<div style="height: 64px; background: #0b0c0e; border-bottom: 1px solid rgba(214,220,232,0.14);"></div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 18px;">
<div style="height: 14px; width: 220px; background: #1c1d22;"></div>
<div style="height: 14px; width: 180px; background: #1c1d22;"></div>
<div style="height: 14px; width: 250px; background: #1c1d22;"></div>
</div>
</div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(0,0,0,0.55);"></div>

<section aria-label="行を書き換える" style="position: absolute; left: 0; top: 56px; width: 390px; height: 788px; box-sizing: border-box; background: #111215; border-top: 1px solid rgba(214,220,232,0.32); border-radius: 16px 16px 0 0; display: flex; flex-direction: column;">

<div style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(214,220,232,0.12);">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d8dbe2" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="6" r="2.5"></circle><path d="M12 9v7M8 12h8M12 16l-3 5M12 16l3 5"></path></svg>
<span style="font-size: 17px;">人間</span>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 14px; color: #a2a5ac;">01行目</span>
<span style="flex-grow: 1;"></span>
<a href="Text.html" aria-label="閉じる" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #d8dbe2;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div style="flex-grow: 1; overflow: hidden; box-sizing: border-box; padding: 12px 18px 0; display: flex; flex-direction: column; gap: 10px;">

<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 11px; letter-spacing: 0.3em; color: #8b8f97;">いまの文章</span>
<span style="font-size: 17px; color: #a6cdff;">人間は二日に一度食べる。</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="editor" style="font-size: 11px; letter-spacing: 0.3em; color: #8b8f97;">書き換える</label>
<textarea id="editor" rows="2" style="box-sizing: border-box; width: 100%; height: 58px; resize: none; padding: 12px 14px; background: #0a0b0d; border: 1px solid #a6cdff; border-radius: 6px; color: #a6cdff; font-family: 'Shippori Mincho', serif; font-size: 18px; line-height: 1.5;">人間は二日に一度だけ食べ、魚を獲る</textarea>
</div>

<div style="box-sizing: border-box; padding: 10px 12px; background: #0c0d10; border: 1px solid rgba(214,220,232,0.14); border-radius: 6px; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;">
<span style="font-size: 11px; letter-spacing: 0.3em; color: #a2a5ac;">世界の読み</span>
<span style="font-size: 10px; color: #8b8f97;"><span style="border-bottom: 2px solid #d8dbe2;">読める</span>　<span style="border-bottom: 2px dotted #c8b2ff;">知らない</span></span>
</div>
<div style="font-size: 17px; line-height: 1.8; letter-spacing: 0.02em;">
<span style="border-bottom: 2px solid #d8dbe2; margin: 0 2px;">人間</span>は<span style="border-bottom: 2px solid #d8dbe2; margin: 0 2px;">二日に一度</span><span style="border-bottom: 2px solid #d8dbe2; margin: 0 2px;">だけ</span><span style="border-bottom: 2px solid #d8dbe2; margin: 0 2px;">食べ</span>、<span style="border-bottom: 2px solid #d8dbe2; margin: 0 2px;">魚</span>を<span style="border-bottom: 2px dotted #c8b2ff; color: #c8b2ff; margin: 0 2px;">獲る</span>
</div>
<div style="font-size: 12px; line-height: 1.6; color: #c8b2ff;">「獲る」は、世界がまだ知らない言葉。この言葉のぶんは世界に届かない。</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #a2a5ac;">読まれ方<span style="padding: 1px 7px; border: 1px solid #d8dbe2; border-radius: 10px; color: #eceae4; background: rgba(216,219,226,0.12);">性質</span><span style="padding: 1px 7px; border: 1px solid rgba(214,220,232,0.2); border-radius: 10px; color: #6f737b;">制度</span><span style="padding: 1px 7px; border: 1px solid rgba(214,220,232,0.2); border-radius: 10px; color: #6f737b;">条件つき</span></div>
<div style="font-size: 12px; line-height: 1.6; color: #d8dbe2;">人の体と習慣が変わる。国がなくても効く。</div>
<a href="Notebook.html" style="align-self: flex-start; min-height: 32px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #d8dbe2; border-bottom: 1px solid rgba(214,220,232,0.4);">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>
世界の辞書で、知っている言葉を探す</a>
</div>

<div style="display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0;">
<button style="height: 40px; padding: 0 14px; background: transparent; border: 1px solid rgba(214,220,232,0.32); border-radius: 20px; color: #d8dbe2; font-family: inherit; font-size: 14px; flex-shrink: 0;">〜ない</button>
<button style="height: 40px; padding: 0 14px; background: transparent; border: 1px solid rgba(214,220,232,0.32); border-radius: 20px; color: #d8dbe2; font-family: inherit; font-size: 14px; flex-shrink: 0;">少し</button>
<button style="height: 40px; padding: 0 14px; background: transparent; border: 1px solid rgba(214,220,232,0.32); border-radius: 20px; color: #d8dbe2; font-family: inherit; font-size: 14px; flex-shrink: 0;">とても</button>
<button style="height: 40px; padding: 0 14px; background: transparent; border: 1px solid rgba(214,220,232,0.32); border-radius: 20px; color: #d8dbe2; font-family: inherit; font-size: 14px; flex-shrink: 0;">ただし</button>
<button style="height: 40px; padding: 0 14px; background: transparent; border: 1px solid rgba(214,220,232,0.32); border-radius: 20px; color: #d8dbe2; font-family: inherit; font-size: 14px; flex-shrink: 0;">〜のとき</button>
<button style="height: 40px; padding: 0 14px; background: transparent; border: 1px solid rgba(214,220,232,0.32); border-radius: 20px; color: #d8dbe2; font-family: inherit; font-size: 14px; flex-shrink: 0;">なしで</button>
</div>

<div style="display: flex; justify-content: space-between; align-items: baseline;">
<span style="font-size: 13px; color: #d8dbe2;"><span style="font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600;">16</span>字<span style="color: #8b8f97;">　＋効き目 0</span></span>
<span style="font-size: 12px; color: #a2a5ac;">使える文字数 <span style="font-family: 'Cormorant Garamond', serif; font-size: 15px;">552 → </span><span style="font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 600; color: #eceae4;">557</span><span style="font-family: 'Cormorant Garamond', serif; font-size: 15px;"> / 590字</span></span>
</div>

<div style="font-size: 12px; line-height: 1.6; color: #ead08f;">この行を書き直すのは2回目。上書きの傷で、世界の整合性が少し下がる。</div>

<div style="display: flex; flex-direction: column; gap: 8px;">

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 20l4-1L19 8l-3-3L5 16l-1 4z"></path><path d="M14 7l3 3"></path></svg>
書き換える<span style="font-size: 12px; color: #a6cdff;">のこり3</span></a>

<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 12h16"></path><path d="M6 7h9M6 17h7"></path></svg>
この行を消す</a>
<a href="Text.html" style="height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(214,220,232,0.32); border-radius: 6px; font-size: 14px; color: #d8dbe2;">元の文に戻す</a>
</div>
</div>

<div style="box-sizing: border-box; padding: 10px 12px; background: #0c0d10; border-radius: 6px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 11px; letter-spacing: 0.3em; color: #8b8f97;">現実では</span>
<span style="font-size: 12px; line-height: 1.7; color: #d8dbe2;">人は1日に約2000〜2500kcalを食べ物からとる。世界の働き手の約4分の1は農業で働いている。</span>
</div>
