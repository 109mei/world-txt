<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ノート（因果の地図）・明るい画面</title>

</head>
<body>
<div>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Shippori+Mincho:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f6f4ef;font-family:'Shippori Mincho',serif;color:#1c1d21}
a{color:#1c1d21;text-decoration:none}a:hover{color:#000000}
/* 考える画面なので動かさない。まだ見ぬつながりは、止まった点線で示す */
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f6f4ef; display: flex; flex-direction: column; overflow: hidden; font-family: 'Shippori Mincho', serif; color: #1c1d21;">

<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #eeebe4; border-bottom: 1px solid rgba(40,42,48,0.14);">
<span style="font-size: 18px; letter-spacing: 0.2em;">ノート</span>
<span style="font-size: 12px; color: #50555e;">見つけたつながり <span style="font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: #1c1d21;">7</span></span>
</header>

<div role="tablist" aria-label="ノートの中身" style="flex-shrink: 0; height: 48px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid rgba(40,42,48,0.14);">
<button role="tab" aria-selected="true" style="background: transparent; border: none; border-bottom: 2px solid #30333a; color: #1c1d21; font-family: inherit; font-size: 14px;">因果の地図</button>
<button role="tab" aria-selected="false" style="background: transparent; border: none; color: #50555e; font-family: inherit; font-size: 14px;">世界の辞書</button>
<button role="tab" aria-selected="false" style="background: transparent; border: none; color: #50555e; font-family: inherit; font-size: 14px;">仮説</button>
<a href="RecordsLight.html" role="tab" aria-selected="false" style="display: flex; align-items: center; justify-content: center; background: transparent; border: none; border-bottom: 2px solid transparent; color: #50555e; font-family: inherit; font-size: 14px;">記録</a>
</div>

<div style="flex-shrink: 0; position: relative; width: 390px; height: 352px; background: #e9e6de;">
<svg width="390" height="352" viewBox="0 0 390 352" style="position: absolute; left: 0; top: 0;" aria-hidden="true">
<g fill="none" stroke-width="1.3">
<path d="M88 50V104" stroke="#1b5aa6"></path>
<path d="M290 50V104" stroke="#1b5aa6"></path>
<path d="M258 126H140" stroke="#30333a"></path>
<path d="M80 146V188" stroke="#30333a"></path>
<path d="M120 222C150 236 170 246 186 256" stroke="#ad3f2a"></path>
<path d="M240 284C250 294 258 302 262 312" stroke="#ad3f2a"></path>
<path stroke-dasharray="4 4" d="M300 146V196" stroke="#6443be"></path>
<path stroke-dasharray="4 4" d="M70 222V300" stroke="#6443be"></path>
</g>
</svg>
<div style="position: absolute; left: 14px; top: 16px; width: 150px; box-sizing: border-box; padding: 6px 8px; border: 1px solid rgba(27,90,166,0.6); background: #e9f0fa; border-radius: 6px; font-size: 12px; color: #1b5aa6; text-align: center;">二日に一度食べる</div>
<div style="position: absolute; left: 216px; top: 16px; width: 150px; box-sizing: border-box; padding: 6px 8px; border: 1px solid rgba(27,90,166,0.6); background: #e9f0fa; border-radius: 6px; font-size: 12px; color: #1b5aa6; text-align: center;">少しの水で育つ</div>
<div style="position: absolute; left: 40px; top: 108px; width: 96px; box-sizing: border-box; padding: 6px 8px; border: 1px solid rgba(40,42,48,0.5); background: #ffffff; border-radius: 16px; font-size: 13px; text-align: center;">食料</div>
<div style="position: absolute; left: 258px; top: 108px; width: 84px; box-sizing: border-box; padding: 6px 8px; border: 1px solid rgba(40,42,48,0.5); background: #ffffff; border-radius: 16px; font-size: 13px; text-align: center;">水</div>
<div style="position: absolute; left: 14px; top: 190px; width: 148px; box-sizing: border-box; padding: 6px 8px; border: 1px solid rgba(173,63,42,0.55); background: #fbece8; border-radius: 6px; font-size: 12px; text-align: center;">農と食の仕事が減る</div>
<div style="position: absolute; left: 150px; top: 254px; width: 128px; box-sizing: border-box; padding: 6px 8px; border: 1px solid rgba(173,63,42,0.55); background: #fbece8; border-radius: 6px; font-size: 12px; text-align: center;">研究が止まる</div>
<div style="position: absolute; left: 196px; top: 312px; width: 170px; box-sizing: border-box; padding: 6px 8px; border: 1px solid rgba(173,63,42,0.55); background: #fbece8; border-radius: 6px; font-size: 12px; text-align: center;">作物の病に弱くなる</div>
<div style="position: absolute; left: 272px; top: 196px; width: 60px; box-sizing: border-box; padding: 6px 8px; border: 1px dashed rgba(100,67,190,0.7); border-radius: 6px; font-size: 13px; color: #6443be; text-align: center;">？</div>
<div style="position: absolute; left: 40px; top: 300px; width: 60px; box-sizing: border-box; padding: 6px 8px; border: 1px dashed rgba(100,67,190,0.7); border-radius: 6px; font-size: 13px; color: #6443be; text-align: center;">？</div>
</div>
<div style="flex-shrink: 0; padding: 6px 16px 0; display: flex; gap: 10px; font-size: 10px; color: #50555e;">
<span style="display: flex; align-items: center; gap: 4px;"><svg width="16" height="10" viewBox="0 0 16 10" aria-hidden="true"><rect x="0.5" y="0.5" width="15" height="9" rx="2" fill="#e9f0fa" stroke="#1b5aa6"></rect></svg>書いた一文</span><span style="display: flex; align-items: center; gap: 4px;"><svg width="16" height="10" viewBox="0 0 16 10" aria-hidden="true"><rect x="0.5" y="0.5" width="15" height="9" rx="4.5" fill="#ffffff" stroke="#30333a"></rect></svg>項目</span><span style="display: flex; align-items: center; gap: 4px;"><svg width="16" height="10" viewBox="0 0 16 10" aria-hidden="true"><rect x="0.5" y="0.5" width="15" height="9" rx="2" fill="#fbece8" stroke="#ad3f2a"></rect></svg>出来事</span><span style="display: flex; align-items: center; gap: 4px;"><svg width="16" height="10" viewBox="0 0 16 10" aria-hidden="true"><path d="M0 5H16" stroke="#6443be" stroke-width="1.2" stroke-dasharray="3 2"></path></svg>まだ見ぬつながり</span>
</div>

<div style="flex-grow: 1; overflow: hidden; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px;">
<div style="box-sizing: border-box; padding: 10px 12px; background: #ffffff; border: 1px solid rgba(131,95,12,0.4); border-radius: 6px; display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 11px; letter-spacing: 0.3em; color: #835f0c;">仮説</span>
<span style="font-size: 14px; line-height: 1.6;">この世界の土は「水が足りない型」</span>
<div style="display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #30333a;">
<span style="display: flex; align-items: center; gap: 8px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#30333a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="見た"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>雨の少ない年が続いている</span>
<span style="display: flex; align-items: center; gap: 8px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#30333a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="見た"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>給水制限が始まった</span>
<span style="display: flex; align-items: center; gap: 8px; color: #5c616a;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5c616a" stroke-width="1.6" stroke-dasharray="3 3" role="img" aria-label="まだ見ていない"><circle cx="12" cy="12" r="7"></circle></svg>川が細っている（まだ見ていない）</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between;">
<span style="font-size: 11px; color: #50555e;">3つそろうと、見立てが確定する</span>
<button style="height: 36px; padding: 0 12px; background: transparent; border: 1px solid rgba(131,95,12,0.6); border-radius: 6px; color: #835f0c; font-family: inherit; font-size: 12px;">書き留める</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 11px; letter-spacing: 0.3em; color: #50555e;">世界の辞書から</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px;">
<span style="padding: 3px 8px; border-bottom: 2px solid #30333a; font-size: 12px;">数日に一度</span>
<span style="padding: 3px 8px; border-bottom: 2px solid #30333a; font-size: 12px;">蔵</span>
<span style="padding: 3px 8px; border-bottom: 2px solid #30333a; font-size: 12px;">分かち合う</span>
<span style="padding: 3px 8px; border-bottom: 2px solid #30333a; font-size: 12px;">ただし</span>
<span style="padding: 3px 8px; border-bottom: 2px dotted #6443be; font-size: 12px; color: #6443be;">獲る</span>
<span style="padding: 3px 8px; border-bottom: 2px dotted #6443be; font-size: 12px; color: #6443be;">収穫量</span>
</div>
</div>
</div>
